# Supabase pauses free projects after a week with no activity, and a paused database takes the site down.
# Opening /ready once a day wakes the site and runs one query. Set the repo variable SITE_URL to turn it on.
name: Keep the database awake

on:
  schedule:
    - cron: "17 6 * * *"  # every day, 06:17 UTC
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    if: vars.SITE_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Retries cover Render's free plan waking from sleep (up to about a minute).
      - run: curl --fail --silent --show-error --retry 4 --retry-delay 20 --retry-all-errors --max-time 90 "${SITE_URL}/ready"
        env:
          SITE_URL: ${{ vars.SITE_URL }}
